name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Taxis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./Taxis/package-lock.json

      - name: Install dependencies
        working-directory: Taxis
        run: |
          pwd
          test -f package-lock.json
          npm ci

      - name: Build
        working-directory: Taxis
        run: npm run build
